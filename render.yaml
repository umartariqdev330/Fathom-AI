services:
  - type: web
    name: meetly-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py --demo
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.6'
      - key: CORS_ORIGINS
        sync: false
